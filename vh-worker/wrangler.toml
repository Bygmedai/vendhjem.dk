# Worker for vendhjem.dk.
#
# To ting i én: det statiske site (bygget af ../build.py), Fonds-CRM'et på
# /internt/fonde og opholdskalenderen på /internt/ophold (begge kun Workeren
# selv besvarer), plus den offentlige kalender på /sporene.
#
# MAA IKKE FJERNES: uden workers_dev = false slaar wrangler workers.dev til igen
# ved hvert deploy, og saa ligger /internt aabent paa
# vendhjem.<subdomain>.workers.dev uden for Access, som er bundet til
# vendhjem.dk-stier. Maalt aabent i S592.
#
# Deploy: tryk paa knappen. GitHub → Actions → «Udrul til Cloudflare» →
# Run workflow. Den koerer migrationer, deploy og et readback, og tokenet
# ligger som hemmelighed hos GitHub.
#
# I haanden, hvis du er en agent med et token i miljoeet:
#   cd vh-worker && npx wrangler@4 d1 migrations apply vendhjem-fonde --remote
#   cd vh-worker && npx wrangler@4 deploy
#
# Stien /tmp/.cf_token_vh stod her indtil 17.09.2026. Den findes ikke paa en
# Windows-maskine — i Git Bash er /tmp bare AppData\Local\Temp — og et
# menneske, der foelger linjen, faar wrangler til at falde tilbage paa en
# udloebet OAuth-session. Skriv aldrig en sandkastesti som en opskrift.

name = "vendhjem"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "e91b41e73aafbedf6e0512076e0544c2"

workers_dev = false
preview_urls = false

[assets]
directory = "../"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# SKAL vaere true, ikke en liste over fonds-stier.
#
# Med en liste serveres alle andre stier direkte fra assets, og saa naar
# host-tjekket i index.js aldrig at koere — og www.vendhjem.dk/internt ligger
# aabent igen. Praecis den fejl blev maalt 16.09.2026: hullet var lukket i
# koden, men wrangler koerte den aldrig.
#
# Med true gaar alt gennem Workeren, som selv kalder env.ASSETS.fetch() for
# alt uden for /internt/fonde, /internt/korpus, /internt/ophold, /sporene og
# /mit. _headers og _redirects gaelder stadig.
run_worker_first = true

[[d1_databases]]
binding = "FONDE_DB"
database_name = "vendhjem-fonde"
database_id = "f1cacc8c-2720-400e-906a-64f2627789e8"
migrations_dir = "migrations"

# Månedlig sikkerhedskopi: den 1. klokken 04:00 UTC. Se src/sikkerhedskopi.js.
[triggers]
crons = ["0 4 1 * *"]

[[r2_buckets]]
binding = "FONDE_FILER"
bucket_name = "vendhjem-fonde-bilag"
