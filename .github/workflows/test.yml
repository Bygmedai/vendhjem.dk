name: Quality Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
    # «edited» er med, fordi Facit-jobbet laeser PR-broedteksten: rettes
    # Facit-linjen efter pushet, skal porten maale den nye tekst — et rerun
    # genbruger den gamle. Maalt paa #60, 19.09.2026.
    types: [opened, synchronize, reopened, edited]

jobs:
  # Worker-proeverne. De daekker brevet, opholdene, overlaps-triggeren,
  # kalenderen, timerne, fundene, login og sikkerhedskopien — og de kunne
  # frem til 18.09.2026 KUN koeres af et menneske i haanden. Siden merge
  # udruller automatisk, var der ingen automat mellem «groen PR» og
  # «ude i produktion». Det er hullet, denne portner lukker.
  #
  # build.py koeres foerst af to grunde: de interne sider er gitignored og
  # findes ikke i et checkout (proeve 11 laeser internt/oekonomi.html), og
  # sti-hegnet i build.py fyrede foer kun i udrul.yml — altsaa EFTER merge.
  # Nu fyrer det paa hver PR.
  proever:
    name: Worker-prøver
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Byg siderne (internt/ findes ikke i checkout)
        run: python3 build.py
      - name: Er de byggede filer i sync med kilderne?
        # Alt, build.py ændrer, er drift. Nye, ukendte filer er også drift.
        #
        # Indtil 23.09 stod her to -I-undtagelser for «Senest ændret» og
        # «export const SENEST», fordi foden bar HEAD-committets dato og
        # derfor skiftede ved merge (run #163, 18.09: main rød og live på
        # samme tid over elleve filer, der kun afveg i datoen). Datoen er
        # fjernet fra foden, så foden er nu determineret af kilden alene, og
        # undtagelserne er væk med den. En undtagelse, der ikke længere
        # undtager noget, skjuler bare den næste ægte drift.
        run: |
          NYE="$(git ls-files --others --exclude-standard)"
          if [ -n "$NYE" ] || ! git diff --quiet; then
            echo "::error::build.py aendrede filer, der er committet. Koer 'python3 build.py' og commit resultatet."
            [ -n "$NYE" ] && { echo "Nye filer:"; echo "$NYE"; }
            git diff --stat
            exit 1
          fi
          echo "Kilder og byggede filer er i sync."
      - name: Prøver
        run: node vh-worker/test/koer.mjs
      - name: Hegn-røg (Worker under test, ikke produktion)
        run: bash vh-worker/test/smoke-hegn.sh

  # Facit: en Worker-ændring uden hvorfor er blind. Kun pull_request —
  # paa push til main er der ingen PR-broedtekst at laese.
  facit:
    name: Facit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scriptets egne prøver
        run: python3 .github/tjek-facit.py --proeve
      - name: Worker-ændring kræver et facit
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          FACIT_BASE: origin/${{ github.base_ref }}
          FACIT_HEAD: HEAD
        run: |
          git fetch origin "${{ github.base_ref }}"
          python3 .github/tjek-facit.py

  html-validate:
    name: HTML Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install -g html-validate
      - name: Validate all HTML files
        run: |
          # Find all HTML files (skip node_modules and backups)
          FILES=$(find . -name "*.html" -not -path "*/node_modules/*" -not -name "*backup*" | sort)
          if [ -z "$FILES" ]; then
            echo "No HTML files found"
            exit 0
          fi
          html-validate $FILES || true
          ERRORS=$(html-validate $FILES 2>&1 | grep -c "error" || true)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS HTML validation errors"
            exit 1
          fi

  broken-links:
    name: Broken Link Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install -g linkinator
      - name: Start local server
        run: |
          npx http-server . -p 8080 -s &
          sleep 2
      - name: Check internal links
        run: |
          linkinator http://localhost:8080 --recurse --skip "^(?!http://localhost)" --format json --timeout 10000 > link-report.json || true
          python3 - link-report.json <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          links = data.get("links", [])
          broken = [l for l in links if l.get("status", 0) >= 400]
          for l in broken:
              print("::error::%s %s  <- linked from %s" % (l.get("status"), l.get("url"), l.get("parent")))
          print("%d links checked, %d broken" % (len(links), len(broken)))
          sys.exit(1 if broken else 0)
          PY

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: |
          npm install -g @lhci/cli
          npm install -g http-server
      - name: Start local server
        run: |
          http-server . -p 8080 -s &
          sleep 2
      - name: Run Lighthouse on key pages
        run: |
          # Auto-discover HTML files (max 6 for CI speed)
          PAGES=()
          # Always include index.html first if it exists
          if [ -f "index.html" ]; then
            PAGES+=("http://localhost:8080/index.html")
          fi
          # Add other root-level HTML files (up to 5 more)
          for f in $(find . -maxdepth 1 -name "*.html" -not -name "index.html" -not -name "*backup*" | sort | head -5); do
            PAGE=$(basename "$f")
            PAGES+=("http://localhost:8080/$PAGE")
          done
          if [ ${#PAGES[@]} -eq 0 ]; then
            echo "No HTML pages found for Lighthouse"
            exit 0
          fi
          FAILED=0
          for URL in "${PAGES[@]}"; do
            PAGE=$(echo "$URL" | sed 's|.*/||')
            echo "=== Testing $PAGE ==="
            lhci collect --url="$URL" --settings.chromeFlags="--no-sandbox --headless" || true
            REPORT=$(ls -t .lighthouseci/lhr-*.json 2>/dev/null | head -1)
            if [ -f "$REPORT" ]; then
              python3 -c "
          import json, sys
          data = json.load(open(sys.argv[1]))
          cats = data.get('categories', {})
          perf = int(cats.get('performance', {}).get('score', 0) * 100)
          a11y = int(cats.get('accessibility', {}).get('score', 0) * 100)
          seo = int(cats.get('seo', {}).get('score', 0) * 100)
          bp = int(cats.get('best-practices', {}).get('score', 0) * 100)
          print(f'  Performance: {perf} | Accessibility: {a11y} | SEO: {seo} | Best Practices: {bp}')
          failed = []
          if a11y < 90: failed.append(f'Accessibility {a11y} < 90')
          if seo < 90: failed.append(f'SEO {seo} < 90')
          if failed:
              for f in failed: print(f'  ::warning::{f}')
              sys.exit(1)
          " "$REPORT"
              if [ $? -ne 0 ]; then FAILED=1; fi
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "::error::One or more pages failed Lighthouse gates"
            exit 1
          fi

  playwright:
    name: Smoke Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install @playwright/test
          npx playwright install chromium --with-deps
      - name: Start local server
        run: |
          npx http-server . -p 8080 -s &
          sleep 2
      - name: Run smoke tests
        run: npx playwright test tests/ --reporter=list
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
          retention-days: 7
